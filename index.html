<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="神﨑レイラ Official Links">
    <title>神﨑レイラ | Official Links</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="container">

        <section class="profile">
            <div class="profile-image">
                <img src="profile.jpg" alt="神﨑レイラ">
            </div>

            <h1>神﨑レイラ</h1>
            <p class="username">Kanzaki Reira</p>

            <p class="bio">
                LIVE STREAMER<br>
                ♡ Hello Reira world ♡
            </p>
        </section>

        <section class="links" aria-label="SNS Links">

            <a
                href="https://www.instagram.com/reira.kanzaki"
                class="link-card instagram"
                target="_blank"
                rel="noopener noreferrer"
            >
                <div class="icon" aria-hidden="true">◎</div>
                <div class="link-text">
                    <strong>Instagram</strong>
                    <span>@reira.kanzaki</span>
                </div>
                <div class="arrow" aria-hidden="true">›</div>
            </a>

            <a
                href="https://www.tiktok.com/@reira.kanzaki"
                class="link-card tiktok"
                target="_blank"
                rel="noopener noreferrer"
            >
                <div class="icon" aria-hidden="true">♪</div>
                <div class="link-text">
                    <strong>TikTok</strong>
                    <span>@reira.kanzaki</span>
                </div>
                <div class="arrow" aria-hidden="true">›</div>
            </a>

            <a
                href="https://x.com/reira_kanzaki"
                class="link-card x"
                target="_blank"
                rel="noopener noreferrer"
            >
                <div class="icon" aria-hidden="true">𝕏</div>
                <div class="link-text">
                    <strong>X</strong>
                    <span>@reira_kanzaki</span>
                </div>
                <div class="arrow" aria-hidden="true">›</div>
            </a>

        </section>

        <footer>
            <p>♡ REIRA OFFICIAL ♡</p>
            <small>© 2026 Reira Kanzaki</small>
        </footer>

    </main>
</body>
</html>
